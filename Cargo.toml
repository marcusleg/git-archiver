[package]
name = "git-archiver"
version = "0.3.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.8", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
humantime = "2.4.0"
maud = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "process", "time", "io-util"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.2.1"
toml_edit = "0.25.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
chromiumoxide = { version = "0.9.1", default-features = false }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["form"] }
scraper = "0.29.0"

[profile.release]
strip = true
