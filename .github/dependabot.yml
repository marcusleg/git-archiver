# Minor and patch updates are grouped into one pull request per ecosystem and
# merged automatically once CI passes (see workflows/dependabot-auto-merge.yml).
# Major updates get a pull request each and wait for a human.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Let a fresh release sit a few days before it can be merged unattended.
    cooldown:
      default-days: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
