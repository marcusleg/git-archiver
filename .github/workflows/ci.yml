name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The browser tests drive this Chrome, which the runner image ships.
  GIT_ARCHIVER_TEST_BROWSER: google-chrome

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The tests drive the real `git` CLI; make sure it's there.
      - run: git --version
      - run: google-chrome --version
      - run: cargo build --locked --all-targets
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          load: true
          tags: git-archiver:smoke-test
          cache-from: type=gha,scope=ci-image
          cache-to: type=gha,mode=max,scope=ci-image
      - run: scripts/smoke-test-image.sh git-archiver:smoke-test
